<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="description"
        content="A modern and professional digital alarm clock"
    >

    <title>Smart Alarm Clock - Live</title>

    <!-- Google Font -->
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap"
        rel="stylesheet"
    >

    <!-- CSS -->
    <link
        rel="stylesheet"
        href="alram style.css"
    >
</head>


<body>

    <!-- Background Decorations -->
    <div class="background-glow glow-one"></div>
    <div class="background-glow glow-two"></div>


    <!-- Main Application -->
    <main class="app">

        <!-- =========================
             HEADER
        ========================== -->

        <header class="header">

            <div class="brand">

                <div class="brand-icon">
                    ⏰
                </div>

                <div class="brand-text">

                    <h1>Alarm Clock</h1>

                    <p>
                        Smart Time Manager
                    </p>

                </div>

            </div>


            <div class="live-badge">

                <span class="live-dot"></span>

                LIVE

            </div>

        </header>


        <!-- =========================
             CLOCK SECTION
        ========================== -->

        <section class="clock-card">

            <div class="clock-top">

                <span>
                    CURRENT TIME
                </span>

                <span class="clock-icon">
                    ◷
                </span>

            </div>


            <div
                id="clock"
                class="clock"
            >
                00:00:00 AM
            </div>


            <div
                id="date"
                class="date"
            >
                Monday, January 1, 2026
            </div>


            <div class="clock-line"></div>


            <div class="clock-message">

                <span class="message-icon">
                    ✦
                </span>

                Your time, perfectly managed.

            </div>

        </section>


        <!-- =========================
             ALARM SECTION
        ========================== -->

        <section class="alarm-card">

            <div class="section-heading">

                <div>

                    <span class="section-label">
                        ALARM
                    </span>

                    <h2>
                        Set your alarm
                    </h2>

                    <p>
                        Choose when you want to wake up.
                    </p>

                </div>


                <div class="alarm-badge">
                    🔔
                </div>

            </div>


            <!-- =========================
                 TIME PICKER
            ========================== -->

            <div class="time-picker">

                <!-- Hour -->

                <div class="time-field">

                    <label for="hour">
                        HOUR
                    </label>

                    <select id="hour">
                    </select>

                </div>


                <div class="time-separator">
                    :
                </div>


                <!-- Minute -->

                <div class="time-field">

                    <label for="minute">
                        MINUTE
                    </label>

                    <select id="minute">
                    </select>

                </div>


                <!-- AM / PM -->

                <div class="time-field period-field">

                    <label for="ampm">
                        PERIOD
                    </label>

                    <select id="ampm">

                        <option value="AM">
                            AM
                        </option>

                        <option value="PM">
                            PM
                        </option>

                    </select>

                </div>

            </div>


            <!-- =========================
                 BUTTONS
            ========================== -->

            <div class="buttons">

                <button
                    class="btn set-btn"
                    onclick="setAlarm()"
                >

                    <span class="btn-icon">
                        +
                    </span>

                    Set Alarm

                </button>


                <button
                    class="btn stop-btn"
                    onclick="stopAlarm()"
                >

                    <span class="btn-icon">
                        ■
                    </span>

                    Stop Alarm

                </button>

            </div>


            <!-- =========================
                 ALARM STATUS
            ========================== -->

            <div
                class="status-card"
                id="statusCard"
            >

                <div class="status-icon">
                    ⏱
                </div>


                <div class="status-info">

                    <span>
                        ALARM STATUS
                    </span>

                    <strong id="status">
                        No Alarm Set
                    </strong>

                </div>


                <div
                    class="status-indicator"
                    id="statusIndicator"
                ></div>

            </div>

        </section>


        <!-- =========================
             FEATURES
        ========================== -->

        <div class="features">

            <div class="feature">

                <span>
                    ✓
                </span>

                Live Clock

            </div>


            <div class="feature">

                <span>
                    ✓
                </span>

                Smart Alarm

            </div>


            <div class="feature">

                <span>
                    ✓
                </span>

                Responsive

            </div>

        </div>


        <!-- =========================
             FOOTER
        ========================== -->

        <footer>

            <span>
                Smart Alarm Clock
            </span>

            <span class="footer-separator">
                •
            </span>

            <span>
                Always On Time
            </span>

        </footer>

    </main>


    <!-- =========================
         ALARM AUDIO
    ========================== -->

    <audio
        id="alarmSound"
        loop
    >

        <source
            src="https://actions.google.com/sounds/v1/alarms/alarm_clock.ogg"
            type="audio/ogg"
        >

    </audio>


    <!-- JavaScript -->

    <script src="alram.js"></script>

</body>

</html>
